[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evo"
version = "0.1.0"
description = "Self-evolving multi-agent orchestration framework"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",

    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.409",
]

[project.scripts]
evo = "evo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evo = [
    "defaults/*.yaml",
    "web/templates/*.html",
    "web/static/*",
    "web/static/**/*",
]
